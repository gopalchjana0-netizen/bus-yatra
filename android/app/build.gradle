plugins {
    id 'com.android.application'
}

android {
    namespace 'com.busyatra'
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions = ["app"]

    productFlavors {
        customer {
            dimension "app"
            applicationId "com.busyatra.customer"
            versionCode 3
            versionName "1.0.2"
            resValue "string", "app_name", "Bus Yatra"
            buildConfigField "String", "PORTAL_URL", "\"https://busyatra.pages.dev/?source=customer_apk\""
        }
        owner {
            dimension "app"
            applicationId "com.busyatra.owner"
            versionCode 3
            versionName "1.0.2"
            resValue "string", "app_name", "Bus Yatra Owner"
            buildConfigField "String", "PORTAL_URL", "\"https://busyatra.pages.dev/owner?source=owner_apk\""
        }
        captain {
            dimension "app"
            applicationId "com.busyatra.captain"
            versionCode 3
            versionName "1.0.2"
            resValue "string", "app_name", "Bus Yatra Captain"
            buildConfigField "String", "PORTAL_URL", "\"https://busyatra.pages.dev/captain?source=captain_apk\""
        }
        admin {
            dimension "app"
            applicationId "com.busyatra.admin"
            versionCode 3
            versionName "1.0.2"
            resValue "string", "app_name", "Bus Yatra Admin"
            buildConfigField "String", "PORTAL_URL", "\"https://busyatra.pages.dev/admin?source=admin_apk\""
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/busyatra-release.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASS") ?: "busyatra2026"
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "busyatra"
            keyPassword System.getenv("ANDROID_KEY_PASS") ?: "busyatra2026"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.core:core:1.12.0'
}
