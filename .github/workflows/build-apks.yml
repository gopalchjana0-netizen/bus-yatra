name: Build Bus Yatra Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Official Release Keystore & Build APKs
        working-directory: ./android
        run: |
          if [ ! -f busyatra-release.jks ]; then
            echo "Generating production release keystore..."
            keytool -genkeypair -v -keystore busyatra-release.jks -alias busyatra -keyalg RSA -keysize 2048 -validity 10000 -storepass busyatra2026 -keypass busyatra2026 -dname "CN=Bus Yatra, OU=Production, O=Bus Yatra, L=Kolkata, ST=West Bengal, C=IN"
          fi
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleCustomerRelease assembleOwnerRelease assembleCaptainRelease assembleAdminRelease --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          # Find and copy the generated APKs with clean naming
          cp $(find android/app/build/outputs/apk/customer/release -name "*.apk" | head -n 1) release-apks/BusYatra-Customer.apk
          cp $(find android/app/build/outputs/apk/owner/release -name "*.apk" | head -n 1) release-apks/BusYatra-Owner.apk
          cp $(find android/app/build/outputs/apk/captain/release -name "*.apk" | head -n 1) release-apks/BusYatra-Captain.apk
          cp $(find android/app/build/outputs/apk/admin/release -name "*.apk" | head -n 1) release-apks/BusYatra-Admin.apk
          ls -la release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BusYatra-All-APKs
          path: release-apks/*.apk

      - name: Publish Official GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 release-apks/*.apk --clobber || gh release create v1.0.0 release-apks/*.apk --title "Bus Yatra Official Android Apps (v1.0.0)" --notes "Official native Android APKs with cloud auto-updates."
